rules:
  R1: block
  R2: block
  R3: warn
  R4: warn
  R5: block
  R6: warn
r4_block_prefixes:
  - textures/skins/
# The structural ambient-occlusion PNGs conventionally end with a capitalized _AO.
allowed_name: '^(?:[a-z0-9_./-]+|textures/skins/structural/ao/(?:[a-z0-9_.-]+/)*[a-z0-9_.-]+_AO\.png)$'
# Includes licence text, editor metadata and common art formats.
allowed_extensions: [.xml, .txt, .png, .dds, .tga, .dae, .pmd, .psa, .json, .jpg, .jpeg, .svg, .bmp, .ico, .xcf, .kra, .blend]
io:
  binary_cache_limit_bytes: 2147483648
  requests_per_second: 2
  timeout_seconds: 25
radar:
  stale_days: 45
  priority_labels: ['Priority/1: Release Blocker', 'Priority/2: Must Have']
  model: deepseek-ai/DeepSeek-V3.2
  endpoint: https://api.siliconflow.cn/v1/chat/completions
  timeout_seconds: 45
  max_comment_chars: 4000
  batch_comments: 24
  budget_cny: 3
  token_cost_cny_per_million: {input: 4, output: 6}
  patterns:
    dependency:
      - '(?i)does anyone know how to animate it\?'
      - '(?i)waiting (?:on|for) [^.?!\n]{3,90}'
      - '(?i)need (?:an? |someone to )(?:animator|animate|rigger|rig)\b'
    rework:
      - '(?i)the texture looked stretched'
      - '(?i)(?:needs|have to|need to) (?:be )?(?:redo|rework|remodel|retexture|fixed)[^.?!\n]{0,65}'
    licensing:
      - '(?i)need to sign the legal waiver'
      - '(?i)(?:missing|need|no) (?:a |the )?(?:licen[sc]e|legal waiver|permission)[^.?!\n]{0,60}'
    duplicate_effort:
      - "(?i)i made all of the above ['\u0027]concepts['\u0027]"
      - '(?i)already (?:made|created|modelled|modeled) [^.?!\n]{3,75}'
      - '(?i)(?:duplicate work|duplicate effort)'
    question_unanswered:
      - '(?i)(?:still unanswered|no (?:one|response) (?:has answered|yet))'
  resolved_patterns:
    dependency:
      - "(?i)he.s going to animate it and I.m going to model it"
    rework:
      - '(?i)(?:fixed the texture|rework (?:is )?done)(?:[^.?!\n]{0,45})'
    licensing:
      - '(?i)(?:waiver (?:has been |is )?signed|permission granted)'
