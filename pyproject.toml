[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "artpipe"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["PyYAML==6.0.3", "fastapi==0.163.1", "jinja2==3.1.6", "uvicorn==0.54.0"]

[project.scripts]
artpipe = "artpipe.__main__:main"

[tool.setuptools]
packages = ["artpipe"]

[tool.setuptools.package-data]
artpipe = ["templates/*.html", "static/*.css"]
